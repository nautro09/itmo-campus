name: itmo-campus
services:
  bot:
    image: ${CAMPUS_IMAGE:?Set CAMPUS_IMAGE to the tested release image}
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    user: "${CAMPUS_UID:-1000}:${CAMPUS_GID:-1000}"
    shm_size: 1gb
    stop_grace_period: 30s
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8787"
      CAMPUS_ENV_FILE: /app/.private/.env
    volumes:
      - ${CAMPUS_ROOT:?Set CAMPUS_ROOT}/data:/app/data
      - ${CAMPUS_ROOT:?Set CAMPUS_ROOT}/.private:/app/.private
    ports:
      - "127.0.0.1:8787:8787"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

server {
    listen 80;
    listen [::]:80;
    server_name campus.flacoo.ru;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / {
        return 301 https://campus.flacoo.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name campus.flacoo.ru;

    ssl_certificate /etc/letsencrypt/live/campus.flacoo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus.flacoo.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CampusSSL:10m;
    ssl_session_tickets off;
    client_max_body_size 64k;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

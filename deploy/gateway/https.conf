map $uri $campus_dynamic_client { default $binary_remote_addr; ~^/viewer/ ""; }
map $uri $campus_asset_client { default ""; ~^/viewer/ $binary_remote_addr; }
limit_req_zone $campus_asset_client zone=campus_assets:2m rate=40r/s;
limit_req_zone $campus_dynamic_client zone=campus_client:10m rate=12r/s;
limit_req_zone $server_name zone=campus_total:1m rate=120r/s;
limit_conn_zone $campus_dynamic_client zone=campus_connections:10m;

map $http_upgrade $campus_upgrade { default upgrade; "" ""; }
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name campus.flacoo.ru;

    ssl_certificate /etc/letsencrypt/live/campus.flacoo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus.flacoo.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CampusSSL:10m;
    ssl_session_tickets off;
    client_max_body_size 64k;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location / {
        limit_req zone=campus_client burst=36 nodelay;
        limit_req zone=campus_assets burst=240 nodelay;
        limit_req zone=campus_total burst=320 nodelay;
        limit_req_status 429;
        limit_conn campus_connections 24;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $campus_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

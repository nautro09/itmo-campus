# Replace campus.example.org before enabling. Keep this block for renewal.
server {
    listen 80;
    server_name campus.example.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 301 https://campus.example.org$request_uri;
    }
}

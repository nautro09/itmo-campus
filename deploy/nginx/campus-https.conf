# Enable after the certificate exists. Nginx runs on the same host as Compose.
server {
    listen 443 ssl;
    server_name campus.example.org;
    ssl_certificate /etc/letsencrypt/live/campus.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

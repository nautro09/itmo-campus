name: Check private login on VPS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-login.yml
      - deploy/check-login.py
permissions:
  contents: read
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y sshpass
      - name: Test isolated browser inside running bot
        env:
          CHECK_LOGIN_ONLY: "1"
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: bash deploy/ssh-deploy.sh

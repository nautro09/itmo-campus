name: CI and deploy
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Shell lint
        run: shellcheck deploy/*.sh deploy/gateway/*.sh
      - name: JavaScript syntax
        run: for file in web/*.js; do node --check "$file"; done
      - name: Deployment regression tests
        run: python -m unittest discover -s tests -p 'test_deploy.py' -v

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        env:
          CAMPUS_IMAGE: itmo-campus:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          CAMPUS_ROOT: /tmp/itmo-campus
        run: |
          docker compose config --quiet
          docker compose -f deploy/compose.production.yaml config --quiet
          docker compose -f deploy/compose.gateway.yaml config --quiet
      - name: Build production image
        run: docker build --pull -t "itmo-campus:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" .
      - name: Test application and Chromium in the production image
        run: |
          docker run --rm --init --shm-size=1g \
            -e TEST_ISU_BROWSER=1 -v "$PWD/tests:/app/tests:ro" -v "$PWD/deploy:/app/deploy:ro" \
            "itmo-campus:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" python -m unittest discover -s tests -v
      - name: Test Docker nginx, HTTPS and certificate reload
        env:
          CAMPUS_TEST_IMAGE: itmo-campus:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 tests/gateway_smoke.py
      - name: Package tested image for deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          docker save "itmo-campus:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" | gzip -1 > dist/image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: production-image
          path: dist/image.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: [lint, container]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: itmo-campus-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip a release superseded by a newer commit
        id: revision
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.revision.outputs.current == 'true'
        with:
          name: production-image
          path: dist
      - name: Install SSH password helper
        if: steps.revision.outputs.current == 'true'
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Deploy and verify health (rollback on failure)
        if: steps.revision.outputs.current == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: bash deploy/ssh-deploy.sh

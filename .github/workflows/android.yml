name: Android
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: sh android/build.sh
      - name: Sign disposable emulator build
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.p12" -storepass android -alias test -keyalg RSA -validity 2 -dname CN=CI
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/test.p12" --ks-pass pass:android android/para-unsigned.apk
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          script: sh android/smoke.sh
